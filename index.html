<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystery Master - Das Drehbuch</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: 'Courier New', monospace;
        -webkit-user-select: none;
        user-select: none;
    }

    #emergency-exit {
        position: fixed;
        top: 0;
        left: 0;
        width: 25%;
        height: 25%;
        z-index: 99999;
    }

    #debug-console {
        display: block; 
        position: fixed;
        top: 10px;
        left: 10px;
        right: 10px;
        height: 35%;
        box-sizing: border-box;
        background: #050505;
        color: #00ff00;
        font-size: 11px;
        line-height: 14px;
        padding: 10px;
        overflow-y: auto;
        border: 2px solid #111;
        z-index: 99998;
    }

    /* =====================================================
       🎬 SEKUNDE 0: DER WALD ERWACHT AUS DEM PECHSCHWARZ
       ===================================================== */
    #show-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw !important;
        height: 100vh !important;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        z-index: 88888;
        opacity: 0;
        visibility: hidden;
        background: url('./wald.gif') no-repeat center center !important;
        background-size: cover !important;
        transition: opacity 2.0s ease-in-out, visibility 2.0s;
    }

    #show-screen.visible {
        opacity: 1 !important;
        visibility: visible !important;
    }

    .forest-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100% !important;
        height: 100% !important;
        background: rgba(0, 0, 0, 0.15); 
        box-shadow: inset 0 0 140px rgba(0,0,0,0.9);
        z-index: 1;
    }

    /* =====================================================
       🌫️ SEKUNDE 7: DER NEBEL VERDICHTET SICH UND VERSCHLUCKT ALLES
       ===================================================== */
    .moving-fog-1, .moving-fog-2 {
        position: absolute;
        width: 300%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 3; /* Liegt VOR Wald und Text */
        background: url('https://githubusercontent.com') repeat-x;
        background-size: 33% 100%;
        opacity: 0;
        /* Startet exakt bei Sekunde 7 und verdichtet sich über 2 Sekunden mörderisch scharf! */
        transition: opacity 2.0s ease-in-out 7.0s;
    }

    /* Wenn sichtbar, schießt der Vordergrund-Nebel bei Sekunde 7 auf undurchdringliche Dichte hoch */
    #show-screen.visible .moving-fog-1 { opacity: 0.75; animation: swayFog 25s linear infinite; }
    #show-screen.visible .moving-fog-2 { opacity: 0.65; top: 10%; animation: swayFog 15s linear infinite reverse; }

    .magic-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        padding-top: 50px;
        box-sizing: border-box;
    }

    /* =====================================================
       📝 SEKUNDE 1: DER TEXT ERSCHEINT IN GLUT-ROT
       📝 SEKUNDE 2,5: DER TEXT BEGINNT LEBENDIG ZU ATMEN
       📝 SEKUNDE 7: TEXT WIRD VOM NEBEL VERSCHLUCKT
       ===================================================== */
    .magic-text {
        color: #e50914 !important; /* Unheimlich loderndes Glut-Rot */
        font-size: 24px;
        font-weight: bold;
        text-shadow: 0 0 15px rgba(229, 9, 20, 0.8), 0 0 35px rgba(0, 0, 0, 1);
        margin: 0 20px 40px 20px;
        letter-spacing: 2px;
        line-height: 34px;
        max-width: 85vw;
        text-align: center;
        opacity: 0;
        /* Blend-In startet bei Sekunde 1 und läuft über 3 Sekunden */
        transition: opacity 3.0s ease-in-out 1.0s;
        z-index: 2; /* Wird bei Sekunde 7 vom Nebel (z-index 3) verschluckt! */
    }

    /* Aktiviert das Erscheinen, das unheimliche Atmen und das Verschlucken */
    #show-screen.visible .magic-text {
        opacity: 1;
        /* Bei Sekunde 2,5 schaltet sich die lebendige Atem-Animation ein! */
        animation: textBreath 4s ease-in-out infinite alternate 2.5s;
    }

    /* =====================================================
       🃏 SEKUNDE 8: DIE SILHOUETTE ZEICHNET SICH IM NEBEL AB
       🃏 SEKUNDE 10: DIE SILHOUETTE WIRD ZUR ECHTEN SPIELKARTE
       ===================================================== */
    .playing-card-image {
        width: 170px;
        height: 250px;
        border-radius: 10px;
        box-shadow: 0 0 40px rgba(0,0,0,1);
        opacity: 0;
        /* Mörderischer Trick: Bei Sekunde 8 pechschwarz (Silhouette), bei Sekunde 10 voll sichtbar! */
        filter: brightness(0) contrast(1); /* Macht das Bild komplett zu einer schwarzen Silhouette */
        transform: translateY(50px) scale(0.9);
        transition: opacity 1.5s ease-in-out 8.0s, filter 2.5s ease-in-out 10.0s, transform 3.0s ease-in-out 8.0s;
        object-fit: contain;
        z-index: 4; /* Schwebt unblockierbar VOR dem dichten Nebel! */
    }

    /* Aktiviert die zeitgesteuerte Verwandlung auf der Bühne */
    #show-screen.visible .playing-card-image {
        opacity: 0.85; /* Silhouette bricht bei Sekunde 8 im Dunst durch */
        transform: translateY(0) scale(1);
        filter: brightness(1) contrast(1); /* Bei Sekunde 10 verpufft die Silhouette und die echte Karte strahlt! */
        animation: cardFloat 4s ease-in-out infinite alternate 11s; /* Das sanfte Schweben startet erst ganz am Ende */
    }

    .birthday-text {
        color: #ffd700 !important; 
        font-size: 20px;
        text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        margin-top: 25px;
        font-weight: bold;
    }

    /* =====================================================
       🎭 DIE HOLLYWOOD-ANIMATIONS-WATT-STATIONEN
       ===================================================== */
    /* Der dichte Waber-Nebel */
    @keyframes swayFog {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-33.33333%, 0, 0); }
    }

    /* Das unheimliche, lebendige Atmen und Pulsieren des Vorhersagetextes */
    @keyframes textBreath {
        0% { transform: scale(0.98) translate50px(0, 0); text-shadow: 0 0 15px rgba(229,9,20,0.7); }
        50% { transform: scale(1.02) translateY(-2px); text-shadow: 0 0 25px rgba(229,9,20,1); letter-spacing: 3px; }
        100% { transform: scale(0.99) translateX(1px); text-shadow: 0 0 18px rgba(229,9,20,0.8); }
    }

    /* Das majestätische Schweben der fertigen Karte */
    @keyframes cardFloat {
        0% { transform: translateY(5px) rotate(-0.5deg); box-shadow: 0 15px 30px rgba(0,0,0,0.8); }
        100% { transform: translateY(-15px) rotate(0.5deg); box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 30px rgba(255,255,255,0.15); }
    }
</style>
</head>
<body>

<div id="emergency-exit"></div>

<div id="debug-console">
    ==================================================<br>
    🚀 SYSTEM-LABOR 4.5: DREHBUCH-TIMELINE AKTIV<br>
    ==================================================<br>
    [STATUS] Warte auf Phase 0: „zusammen“...
</div>

<!-- DAS DRAMATISCHE HOLLYWOOD-LAYOUT -->
<div id="show-screen">
    <div class="forest-overlay"></div>
    <div class="moving-fog-1"></div>
    <div class="moving-fog-2"></div>
    <div class="magic-content">
        <div class="magic-text" id="res-prediction">Verbinde Gedankenkanäle...</div>
        <img class="playing-card-image" id="res-karte" src="karten/rueckseite.png" alt="Spielkarte">
        <div class="magic-text birthday-text" id="res-geburtstag"></div>
    </div>
</div>


<script>
let phase = 0;
let kartenFarbe = "";
let kartenWert = 0;
let zuschauerName = "";
let geburtsTag = null;
let geburtsMonat = null;
let geburtsDatum = "";
let istGeburtstag = false;

let phase1Text = "";
let phase2Text = "";
let phase3Text = "";

let verarbeitetesResultat = 0;
let benutzerScrollt = false;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const consoleDiv = document.getElementById("debug-console");

consoleDiv.addEventListener("scroll", () => {
    if (consoleDiv.scrollHeight - consoleDiv.scrollTop > consoleDiv.clientHeight + 30) {
        benutzerScrollt = true;
    } else {
        benutzerScrollt = false;
    }
});

function logToConsole(text) {
    if (consoleDiv) {
        consoleDiv.innerHTML += "<br>" + text;
        if (!benutzerScrollt) {
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
    }
}

const deutscheZahlen = {
    "null": 0, "eins": 1, "ein": 1, "zwei": 2, "drei": 3, "vier": 4, "fünf": 5, "funf": 5, "sechs": 6, "sieben": 7, "acht": 8, "neun": 9,
    "zehn": 10, "elf": 11, "zwölf": 12, "zwolf": 12, "dreizehn": 13, "vierzehn": 14, "fünfzehn": 15, "funfzehn": 15, "sechzehn": 16,
    "siebzehn": 17, "achtzehn": 18, "neunzehn": 19, "zwanzig": 20, "einundzwanzig": 21, "zweiundzwanzig": 22, "dreiundzwanzig": 23,
    "vierundzwanzig": 24, "fünfundzwanzig": 25, "funfundzwanzig": 25, "sechsundzwanzig": 26, "siebenundzwanzig": 27, "achtundzwanzig": 28,
    "neunundzwanzig": 29, "dreißig": 30, "dreissig": 30, "einunddreißig": 31, "einunddreissig": 31
};

function findeZahlen(text) {
    let zahlen = [];
    let gesaeubert = text.replace(/\./g, " ");
    const mitZiffern = gesaeubert.match(/\d+/g);
    if (mitZiffern) {
        for (const zahl of mitZiffern) {
            const wert = parseInt(zahl, 10);
            if (!isNaN(wert)) { zahlen.push(wert); }
        }
    }
    const woerter = gesaeubert.toLowerCase().replace(/[.,!?;:]/g, " ").split(/\s+/).filter(Boolean);
    for (const wort of woerter) {
        if (Object.prototype.hasOwnProperty.call(deutscheZahlen, wort)) {
            zahlen.push(deutscheZahlen[wort]);
        }
    }
    return zahlen;
}

function verarbeiteCodewoerter(text) {
    let etwasGefunden = false;
    text = text.toLowerCase()
        .replace(/\bein\s+mal/g, "einmal")
        .replace(/\bzwei\s+mal/g, "zweimal")
        .replace(/\bdrei\s+mal/g, "dreimal")
        .replace(/\bvier\s+mal/g, "viermal");

    if (/\bhänden\b/.test(text) || /\bhaenden\b/.test(text)) { kartenWert += 10; etwasGefunden = true; logToConsole("👉 [CODE] HÄNDEN erkannt (+10)"); }
    if (/\beinmal\b/.test(text)) { kartenWert += 1; etwasGefunden = true; logToConsole("👉 [CODE] EINMAL erkannt (+1)"); }
    if (/\bzweimal\b/.test(text)) { kartenWert += 2; etwasGefunden = true; logToConsole("👉 [CODE] ZWEIMAL erkannt (+2)"); }
    if (/\bdreimal\b/.test(text)) { kartenWert += 3; etwasGefunden = true; logToConsole("👉 [CODE] DREIMAL erkannt (+3)"); }
    if (/\bviermal\b/.test(text)) { kartenWert += 4; etwasGefunden = true; logToConsole("👉 [CODE] VIERMAL erkannt (+4)"); }
    if (!/\bhänden\b/.test(text) && !/\bhaenden\b/.test(text) && /\bhand\b/.test(text)) { kartenWert += 5; etwasGefunden = true; logToConsole("👉 [CODE] HAND erkannt (+5)"); }
    if (etwasGefunden) { logToConsole("📊 RECHENWERT AKTUELL: " + kartenWert); }
}

if (!SpeechRecognition) {
    logToConsole("❌ FEHLER: Dieser Browser unterstützt webkitSpeechRecognition nicht!");
} else {
    const recognition = new SpeechRecognition();
    recognition.lang = "de-DE";
    recognition.continuous = false; 
    recognition.interimResults = false;

    recognition.onstart = () => { logToConsole("🎤 SPRACHERKENNUNG GESTARTET"); };
    recognition.onaudiostart = () => { logToConsole("🎧 MIKROFON / AUDIO AKTIV"); };
    recognition.onspeechstart = () => { logToConsole("🗣️ SPRACHE ERKANNT"); };
    recognition.onerror = (event) => {
        logToConsole("⚠️ SPRACHERKENNUNGS-FEHLER: " + event.error);
        if (event.error === "no-speech" || event.error === "aborted") {
            if (phase < 4) {
                setTimeout(() => { try { recognition.start(); } catch (e) {} }, 250);
            }
        }
    };

    recognition.onresult = (event) => {
        for (let i = verarbeitetesResultat; i < event.results.length; i++) {
            const result = event.results[i];
            if (!result || !result[0]) { continue; }
            let roherText = result[0].transcript;
            if (!roherText) { continue; }
            roherText = roherText.toLowerCase().trim();
            verarbeitetesResultat = i + 1;

            let text = roherText
                .replace(/ein\s+mal/g, "einmal").replace(/zwei\s+mal/g, "zweimal").replace(/drei\s+mal/g, "dreimal").replace(/vier\s+mal/g, "viermal")
                .replace(/reihem\s+folge/g, "reihenfolge").replace(/reihen\s+folge/g, "reihenfolge")
                .replace(/garten/g, "reihenfolge").replace(/kartendeckt/g, "reihenfolge").replace(/deckels/g, "reihenfolge")
                .replace(/beachte/g, "14").replace(/achte/g, "8").replace(/ranz/g, "franz").replace(/wolf/g, "12")
                .replace(/dein\s+datum/g, "dein datum");

            logToConsole("<br>📢 [GEHÖRT] „" + roherText + "“");
            if (roherText !== text) { logToConsole("✨ [GEBÜGELT] „" + text + "“"); }
            verarbeiteSprache(text);
        }
    };

    function verarbeiteSprache(text) {
        logToConsole("🔍 [ANALYSE] Prüfe Phase " + phase + "...");
        /* ================================================
           PHASE 0
           ZUSAMMEN
           ================================================ */
        if (phase === 0) {
            if (text.includes("zusammen")) {
                phase = 1;
                phase1Text = "";
                logToConsole("▶️ „ZUSAMMEN“ ERKANNT -> PHASE 1: SUCHE KARTENFARBE");
            }
            return;
        }

        /* ================================================
           PHASE 1
           KARTENFARBE
           ================================================ */
        if (phase === 1) {
            phase1Text += " " + text;
            phase1Text = phase1Text.replace(/reihen\s+folge/g, "reihenfolge");

            if (phase1Text.includes("passiert")) { kartenFarbe = "Pik ♠"; }
            else if (phase1Text.includes("geschehen")) { kartenFarbe = "Herz ♥"; }
            else if (phase1Text.includes("gewesen")) { kartenFarbe = "Kreuz ♣"; }
            else if (phase1Text.includes("gehabt")) { kartenFarbe = "Karo ♦"; }

            if (kartenFarbe !== "") {
                logToConsole("🃏 KARTENFARBE: " + kartenFarbe);
                phase = 2;
                phase2Text = "";
                logToConsole("PHASE 2: CODEWÖRTER ZÄHLEN");
                return;
            }
            return;
        }

        /* ================================================
           PHASE 2
           CODEWÖRTER + REIHENFOLGE
           ================================================ */
        if (phase === 2) {
            phase2Text += " " + text;
            phase2Text = phase2Text.replace(/reihen\s+folge/g, "reihenfolge");
            verarbeiteCodewoerter(text);

            const reihenfolgeErkannt = phase2Text.includes("reihenfolge");
            const folgeKartenErkannt = phase2Text.includes("folge") && phase2Text.includes("karten") && phase2Text.includes("bestimmt");
            const kartenDeckBestimmt = phase2Text.includes("karten") && phase2Text.includes("deck") && phase2Text.includes("bestimmt");

            if (reihenfolgeErkannt || folgeKartenErkannt || kartenDeckBestimmt) {
                phase = 3;
                phase3Text = "";
                logToConsole("🔒 REIHENFOLGE ERKANNT -> KARTENWERT: " + kartenWert + " -> PHASE 3: NAME / DATUM");
                return;
            }
            return;
        }

        /* ================================================
           PHASE 3
           NAME / DATUM / HEUTE / VERDECKT
           ================================================ */
        if (phase === 3) {
            phase3Text += " " + text;

            /* NAME RECHNEN */
            const datumPosition = phase3Text.indexOf("dein datum");
            if (datumPosition > 0 && zuschauerName === "") {
                let nameTeil = phase3Text.substring(0, datumPosition).trim();
                const woerter = nameTeil.split(/\s+/);
                if (woerter.length > 0) {
                    nameTeil = woerter[woerter.length - 1].replace(/^[,.:;!? ]+|[,.:;!? ]+$/g, "");
                    if (nameTeil !== "" && nameTeil.toLowerCase() !== "name") {
                        zuschauerName = nameTeil.charAt(0).toUpperCase() + nameTeil.slice(1);
                        logToConsole("👤 NAME: " + zuschauerName);
                    }
                }
            }

            /* HEUTE TRIGGER */
            if (geburtsTag === null && phase3Text.includes("heute")) {
                const heute = new Date();
                geburtsTag = heute.getDate();
                geburtsMonat = heute.getMonth() + 1;
                geburtsDatum = String(geburtsTag).padStart(2, "0") + "." + String(geburtsMonat).padStart(2, "0");
                logToConsole("📅 DATUM: HEUTE → " + geburtsDatum);
            }

            /* ALSO TRIGGER */
            if (geburtsTag === null) {
                const alsoPosition = phase3Text.indexOf("also");
                if (alsoPosition !== -1) {
                    const nachAlso = phase3Text.substring(alsoPosition + 4);
                    const zahlen = findeZahlen(nachAlso);
                    if (zahlen.length >= 2) {
                        const tag = zahlen[0];
                        const monat = zahlen[1];
                        if (tag >= 1 && tag <= 31 && monat >= 1 && monat <= 12) {
                            geburtsTag = tag;
                            geburtsMonat = monat;
                            geburtsDatum = String(tag).padStart(2, "0") + "." + String(monat).padStart(2, "0");
                            logToConsole("📅 DATUM: " + geburtsDatum);
                        }
                    }
                }
            }

            if (phase3Text.includes("verdeckt")) {
                phase = 4;
                logToConsole("🛑 „VERDECKT“ ERKANNT");
                logToConsole("🎤 SPRACHERKENNUNG WIRD PLANMÄSSIG BEENDET");

                const heute = new Date();
                const heuteTag = heute.getDate();
                const heuteMonat = heute.getMonth() + 1;
                istGeburtstag = geburtsTag === heuteTag && geburtsMonat === heuteMonat;

                let finalerShowText = "";
                if (zuschauerName !== "" && geburtsDatum !== "") {
                    finalerShowText = zuschauerName + ", du wirst den " + geburtsDatum + " als Datum nennen.";
                } else if (zuschauerName === "" && geburtsDatum !== "") {
                    finalerShowText = "Du wirst den " + geburtsDatum + " als Datum nennen.";
                } else if (zuschauerName !== "" && geburtsDatum === "") {
                    finalerShowText = zuschauerName + ", dies ist deine persönliche Vorhersage.";
                } else {
                    finalerShowText = "Dies ist deine persönliche Vorhersage.";
                }

                let farbPräfix = "herz"; 
                if (kartenFarbe.includes("Pik")) farbPräfix = "pik";
                else if (kartenFarbe.includes("Kreuz")) farbPräfix = "kreuz";
                else if (kartenFarbe.includes("Karo")) farbPräfix = "karo";

                let finalerBildPfad = "karten/" + farbPräfix + "_" + kartenWert + ".png";

                const resPredictionEl = document.getElementById("res-prediction");
                if (resPredictionEl) { resPredictionEl.innerHTML = finalerShowText; }
                
                const kartenBildEl = document.getElementById("res-karte");
                if (kartenBildEl) { kartenBildEl.src = finalerBildPfad; }

                const geburtstagsAnzeige = document.getElementById("res-geburtstag");
                if (istGeburtstag && geburtstagsAnzeige) {
                    geburtstagsAnzeige.innerHTML = "Alles Gute zum Geburtstag! 🎂✨";
                }

                const showScreenEl = document.getElementById("show-screen");
                if (showScreenEl) { showScreenEl.classList.add("visible"); }

                logToConsole("--------------------------------");
                logToConsole("🏆 FINAL-REPORT DER SHOW-LOGIK:");
                logToConsole("FARBE GELESEN: " + kartenFarbe);
                logToConsole("WERT BERECHNET: " + kartenWert);
                logToConsole("GRAFIK-DATEI GELADEN: " + finalerBildPfad);
                logToConsole("TEXT INJEKTION: " + finalerShowText);
                logToConsole("--------------------------------");

                recognition.stop();
                return;
            }
            return;
        }
    }

    let neustartTimer = null;
    let antiLoopSperre = false;

    recognition.onend = () => {
        logToConsole("⏹️ SPRACHERKENNUNG BEENDET");
        if (phase < 4) {
            if (antiLoopSperre) return;
            antiLoopSperre = true;
            if (neustartTimer) { clearTimeout(neustartTimer); }
            neustartTimer = setTimeout(() => {
                try {
                    verarbeitetesResultat = 0; 
                    recognition.start();
                    setTimeout(() => { antiLoopSperre = false; }, 1000);
                } catch (e) { antiLoopSperre = false; }
            }, 800); 
        }
    };

    try { recognition.start(); } catch (e) { logToConsole("❌ STARTFEHLER: " + e.message); }
}

let exitTimer = null;
document.getElementById("emergency-exit").addEventListener("touchstart", () => {
    exitTimer = setTimeout(() => { location.reload(); }, 3000);
});
document.getElementById("emergency-exit").addEventListener("touchend", () => {
    clearTimeout(exitTimer);
});
</script>
</body>
</html>
